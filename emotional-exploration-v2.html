<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Emotional Space Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: #F5F3F0;
            touch-action: none;
            position: fixed;
        }

        /* Word tiles strip in center */
        .word-container {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 20px) + 120px);
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            max-width: 90%;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 100;
            padding: 8px;
        }

        .word-container::-webkit-scrollbar {
            display: none;
        }

        .word-tile {
            min-width: 80px;
            height: 44px;
            padding: 0 18px;
            border-radius: 22px;
            font-size: 14px;
            letter-spacing: 0.3px;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 180ms cubic-bezier(0.19, 1, 0.22, 1);
            flex-shrink: 0;
            color: #333;
        }

        .word-tile:active {
            transform: scale(0.98) translateY(1px);
        }

        .word-tile.selected {
            transform: translateY(2px);
            box-shadow: 0 0 12px var(--word-color);
        }

        /* Blob canvas */
        #blob-canvas {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            touch-action: none;
            z-index: 1;
        }

        /* Action bar at bottom */
        .action-bar {
            position: fixed;
            bottom: env(safe-area-inset-bottom, 20px);
            left: 16px;
            right: 16px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            gap: 12px;
        }

        .generate-button {
            flex: 1;
            max-width: 200px;
            height: 56px;
            border-radius: 28px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
            transition: all 300ms cubic-bezier(0.19, 1, 0.22, 1);
            letter-spacing: 0.5px;
        }

        .generate-button:active {
            transform: scale(0.96);
        }

        .generate-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .control-button {
            width: 48px;
            height: 48px;
            border-radius: 24px;
            border: none;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 200ms ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .control-button:active {
            transform: scale(0.9);
        }

        .history-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            backdrop-filter: blur(8px);
            align-items: center;
        }

        .history-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            transition: all 200ms ease;
        }

        .history-dot.active {
            background: #667eea;
            transform: scale(1.3);
        }

        /* Gesture feedback overlay */
        .gesture-feedback {
            position: fixed;
            top: calc(env(safe-area-inset-top, 20px));
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 200;
            opacity: 0;
            transition: opacity 200ms ease;
            pointer-events: none;
        }

        .gesture-feedback.show {
            opacity: 1;
        }

        /* Generation modal */
        .generation-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 1);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 400ms ease;
        }

        .generation-modal.show {
            display: flex;
            opacity: 1;
        }

        .generation-content {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #output-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            animation: artEnter 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        @keyframes artEnter {
            0% {
                opacity: 0;
                transform: scale(0.8) rotate(-5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .modal-buttons {
            position: fixed;
            bottom: env(safe-area-inset-bottom, 20px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 1001;
        }

        .modal-button {
            padding: 14px 28px;
            border: none;
            border-radius: 28px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 200ms ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .modal-button.primary {
            background: rgba(102, 126, 234, 0.9);
            color: white;
        }

        .modal-button.secondary {
            background: #f0f0f0;
            color: #333;
        }

        .modal-button:active {
            transform: scale(0.97);
        }

        /* Particles for visual feedback */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            border-radius: 50%;
        }

        /* Loading animation */
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .generating {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Hint text */
        .hint-text {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0, 0, 0, 0.2);
            font-size: 18px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 0;
            text-align: center;
            opacity: 1;
            transition: opacity 600ms ease;
        }

        .hint-text.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
    <!-- Word tiles -->
    <div class="word-container" id="wordContainer">
        <div class="word-tile" data-word="warm" data-color="#D4A574" data-texture="viscous">warm</div>
        <div class="word-tile" data-word="cool" data-color="#6B7C8E" data-texture="crisp">cool</div>
        <div class="word-tile" data-word="soft" data-color="#C2D4DD" data-texture="blur">soft</div>
        <div class="word-tile" data-word="sharp" data-color="#00A8B8" data-texture="angular">sharp</div>
        <div class="word-tile" data-word="heavy" data-color="#4A4A4A" data-texture="dense">heavy</div>
        <div class="word-tile" data-word="light" data-color="#EBE4D8" data-texture="airy">light</div>
        <div class="word-tile" data-word="rough" data-color="#C17B5C" data-texture="granular">rough</div>
        <div class="word-tile" data-word="smooth" data-color="#E3C4C4" data-texture="glossy">smooth</div>
    </div>

    <!-- Blob canvas -->
    <canvas id="blob-canvas"></canvas>

    <!-- Hint text -->
    <div class="hint-text" id="hintText">
        select words · touch the blob · create
    </div>

    <!-- Action bar -->
    <div class="action-bar">
        <button class="control-button" id="undoButton" title="Undo">↻</button>
        <button class="generate-button" id="generateButton" disabled>Generate</button>
        <div class="history-indicator" id="historyIndicator">
            <div class="history-dot"></div>
            <div class="history-dot"></div>
            <div class="history-dot"></div>
        </div>
    </div>

    <!-- Gesture feedback -->
    <div class="gesture-feedback" id="gestureFeedback"></div>

    <!-- Generation modal -->
    <div class="generation-modal" id="generationModal">
        <div class="generation-content">
            <h2 style="margin-bottom: 12px; color: #333;">Your Emotional Composition</h2>
            <canvas id="output-canvas" width="1080" height="1920"></canvas>
            <div class="modal-buttons">
                <button class="modal-button secondary" id="closeModal">Close</button>
                <button class="modal-button primary" id="downloadButton">Download</button>
            </div>
        </div>
    </div>

    <script>
        class EmotionalExplorer {
            constructor() {
                this.canvas = document.getElementById('blob-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.resizeCanvas();

                // Session state
                this.events = [];
                this.selectedWords = new Set();
                this.sessionId = Date.now();

                // Blob state
                this.blob = {
                    x: 0.5,
                    y: 0.4,
                    baseRadius: 0.35,
                    density: 1.0,
                    vertices: 12,
                    points: [],
                    flowField: [],
                    colors: [],
                    pullPoints: []  // Points being pulled/kneaded
                };

                this.initBlob();

                // Interaction state
                this.touchStart = null;
                this.touchPath = [];
                this.lastTouch = null;
                this.gestureStartTime = 0;
                this.isPinching = false;
                this.initialPinchDistance = 0;
                this.isKneading = false;
                this.kneadingPoint = null;

                // Combo/tap state
                this.lastTapTime = 0;
                this.comboCount = 0;
                this.comboTimer = null;
                this.showCombo = false;
                this.comboFade = 0;

                // Visual state
                this.backgroundColor = { r: 245, g: 243, b: 240 };
                this.particles = [];
                this.time = 0;
                this.shakeIntensity = 0;

                // Generation animation state
                this.isGenerating = false;
                this.generationTime = 0;
                this.generatedFeatures = null;
                this.outputCanvas = null;
                this.outputCtx = null;

                this.setupEventListeners();
                this.animate();
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            initBlob() {
                this.blob.points = [];
                for (let i = 0; i < this.blob.vertices; i++) {
                    const angle = (i / this.blob.vertices) * Math.PI * 2;
                    this.blob.points.push({
                        angle,
                        radius: this.blob.baseRadius,
                        targetRadius: this.blob.baseRadius,
                        noiseOffset: Math.random() * 100,
                        offsetX: 0,  // X offset for playdough effect
                        offsetY: 0,  // Y offset for playdough effect
                        targetOffsetX: 0,
                        targetOffsetY: 0
                    });
                }
                this.blob.colors = [{ r: 200, g: 200, b: 220, a: 0.3 }];
            }

            setupEventListeners() {
                // Word tile clicks
                document.querySelectorAll('.word-tile').forEach(tile => {
                    tile.addEventListener('click', (e) => this.onWordSelect(e));
                });

                // Canvas touch gestures
                this.canvas.addEventListener('touchstart', (e) => this.onTouchStart(e), { passive: false });
                this.canvas.addEventListener('touchmove', (e) => this.onTouchMove(e), { passive: false });
                this.canvas.addEventListener('touchend', (e) => this.onTouchEnd(e), { passive: false });

                // Mouse gestures (for desktop testing)
                this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
                this.canvas.addEventListener('mouseup', (e) => this.onMouseUp(e));

                // Control buttons
                document.getElementById('undoButton').addEventListener('click', () => this.undo());
                document.getElementById('generateButton').addEventListener('click', () => this.generate());
                document.getElementById('closeModal').addEventListener('click', () => this.closeModal());
                document.getElementById('downloadButton').addEventListener('click', () => this.download());

                // Window resize
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            // Word selection
            onWordSelect(e) {
                const tile = e.currentTarget;
                const word = tile.dataset.word;
                const color = tile.dataset.color;
                const texture = tile.dataset.texture;

                const isSelected = this.selectedWords.has(word);

                if (isSelected) {
                    this.selectedWords.delete(word);
                    tile.classList.remove('selected');
                    tile.style.background = 'rgba(255, 255, 255, 0.4)';
                    tile.style.border = '1px solid rgba(0, 0, 0, 0.08)';
                } else {
                    this.selectedWords.add(word);
                    tile.classList.add('selected');
                    tile.style.setProperty('--word-color', color + '60');
                    tile.style.background = color + '33';
                    tile.style.border = `2px solid ${color}99`;

                    // Add to blob colors
                    const rgb = this.hexToRgb(color);
                    this.blob.colors.push({ ...rgb, a: 0.4 });

                    // Create particles
                    this.createParticles(
                        tile.offsetLeft + tile.offsetWidth / 2,
                        tile.offsetTop + tile.offsetHeight / 2,
                        rgb
                    );
                }

                this.logEvent({
                    type: 'word_select',
                    data: { word, selected: !isSelected, color, texture }
                });

                this.updateUI();
                document.getElementById('hintText').classList.add('hidden');
            }

            // Touch gesture detection
            onTouchStart(e) {
                e.preventDefault();

                if (e.touches.length === 1) {
                    // Single touch
                    const touch = e.touches[0];
                    const pos = this.getTouchPos(touch);

                    this.touchStart = { ...pos, time: Date.now() };
                    this.gestureStartTime = Date.now();
                    this.touchPath = [pos];
                    this.lastTouch = pos;

                    // Check if touching blob area
                    if (this.isTouchingBlob(pos)) {
                        this.isKneading = true;
                        this.kneadingPoint = this.getClosestBlobPoint(pos);
                    }
                } else if (e.touches.length === 2) {
                    // Two-finger pinch
                    this.isPinching = true;
                    const dist = this.getTouchDistance(e.touches[0], e.touches[1]);
                    this.initialPinchDistance = dist;
                }
            }

            onTouchMove(e) {
                e.preventDefault();

                if (this.isPinching && e.touches.length === 2) {
                    const currentDist = this.getTouchDistance(e.touches[0], e.touches[1]);
                    const scale = currentDist / this.initialPinchDistance;
                    this.blob.density *= (1 + (scale - 1) * 0.1);
                    this.blob.density = Math.max(0.5, Math.min(1.5, this.blob.density));
                    this.initialPinchDistance = currentDist;
                } else if (e.touches.length === 1 && this.touchStart) {
                    const touch = e.touches[0];
                    const pos = this.getTouchPos(touch);
                    this.touchPath.push(pos);
                    this.lastTouch = pos;

                    // Apply kneading effect
                    if (this.isKneading && this.kneadingPoint !== null) {
                        this.applyKneading(pos);
                    }
                }
            }

            onTouchEnd(e) {
                e.preventDefault();

                if (this.isPinching) {
                    this.logEvent({
                        type: 'pinch',
                        data: {
                            scaleChange: this.blob.density,
                            densityDelta: this.blob.density - 1.0
                        }
                    });
                    this.showGestureFeedback('pinch');
                    this.isPinching = false;
                    this.updateUI();
                    return;
                }

                if (!this.touchStart || !this.lastTouch) return;

                const duration = Date.now() - this.gestureStartTime;
                const distance = this.getDistance(this.touchStart, this.lastTouch);
                const velocity = distance / (duration / 1000);

                // Classify gesture
                if (this.isKneading && distance > 20) {
                    // Kneading / pulling
                    this.handleKnead(this.touchPath, duration);
                } else if (duration > 400 && distance < 20) {
                    // Press & hold
                    this.handlePress(this.touchStart, duration);
                } else if (distance < 10 && duration < 150) {
                    // Tap / poke (check for combo)
                    this.handleTap(this.touchStart);
                } else if (velocity > 600) {
                    // Flick
                    this.handleFlick(this.touchStart, this.lastTouch, velocity);
                } else if (distance > 40 && velocity < 300) {
                    // Caress / brush
                    this.handleCaress(this.touchPath, duration);
                }

                // Reset
                this.touchStart = null;
                this.touchPath = [];
                this.lastTouch = null;
                this.isKneading = false;
                this.kneadingPoint = null;
            }

            // Mouse events (desktop)
            onMouseDown(e) {
                const pos = this.getMousePos(e);
                this.touchStart = { ...pos, time: Date.now() };
                this.gestureStartTime = Date.now();
                this.touchPath = [pos];
                this.lastTouch = pos;

                // Check if touching blob area for kneading
                if (this.isTouchingBlob(pos)) {
                    this.isKneading = true;
                    this.kneadingPoint = this.getClosestBlobPoint(pos);
                }
            }

            onMouseMove(e) {
                if (!this.touchStart) return;
                const pos = this.getMousePos(e);
                this.touchPath.push(pos);
                this.lastTouch = pos;

                // Apply kneading effect for mouse drag
                if (this.isKneading && this.kneadingPoint !== null) {
                    this.applyKneading(pos);
                }
            }

            onMouseUp(e) {
                if (!this.touchStart) return;

                const duration = Date.now() - this.gestureStartTime;
                const distance = this.getDistance(this.touchStart, this.lastTouch);
                const velocity = distance / (duration / 1000);

                // Classify gesture
                if (this.isKneading && distance > 20) {
                    // Kneading / pulling
                    this.handleKnead(this.touchPath, duration);
                } else if (duration > 400 && distance < 20) {
                    this.handlePress(this.touchStart, duration);
                } else if (distance < 10 && duration < 150) {
                    this.handleTap(this.touchStart);
                } else if (velocity > 600) {
                    this.handleFlick(this.touchStart, this.lastTouch, velocity);
                } else if (distance > 40) {
                    this.handleCaress(this.touchPath, duration);
                }

                this.touchStart = null;
                this.touchPath = [];
                this.isKneading = false;
                this.kneadingPoint = null;
            }

            // Gesture handlers
            handleCaress(path, duration) {
                if (path.length < 2) return;

                const start = path[0];
                const end = path[path.length - 1];
                const direction = this.normalize(end.x - start.x, end.y - start.y);
                const pathLength = this.getPathLength(path);

                this.blob.points.forEach((point, i) => {
                    const stretch = 1.1 + Math.random() * 0.1;
                    point.targetRadius = this.blob.baseRadius * stretch;
                });

                this.logEvent({
                    type: 'caress',
                    data: {
                        direction: [direction.x, direction.y],
                        intensity: Math.min(1, pathLength / 200),
                        duration,
                        pathLength: Math.round(pathLength)
                    }
                });

                this.showGestureFeedback('caress');
                this.updateUI();
            }

            handlePoke(pos) {
                // Create ripple effect
                this.blob.points.forEach((point, i) => {
                    point.targetRadius = this.blob.baseRadius * (0.9 + Math.random() * 0.2);
                });

                this.logEvent({
                    type: 'poke',
                    data: {
                        position: [pos.x, pos.y],
                        intensity: 1.0
                    }
                });

                this.showGestureFeedback('poke');
                this.updateUI();
            }

            handleTap(pos) {
                const now = Date.now();
                const timeSinceLastTap = now - this.lastTapTime;

                // Combo detection: if tap within 500ms, it's a combo
                if (timeSinceLastTap < 500) {
                    this.comboCount++;
                } else {
                    this.comboCount = 1;
                }

                this.lastTapTime = now;

                // Reset combo timer
                clearTimeout(this.comboTimer);
                this.comboTimer = setTimeout(() => {
                    this.comboCount = 0;
                    this.showCombo = false;
                }, 1000);

                // Show combo indicator
                if (this.comboCount > 1) {
                    this.showCombo = true;
                    this.comboFade = 1.0;
                }

                // Apply effect based on combo count
                const intensity = Math.min(2.0, 1.0 + (this.comboCount - 1) * 0.3);

                // Stronger ripple for combos
                this.blob.points.forEach((point, i) => {
                    point.targetRadius = this.blob.baseRadius * (0.8 + Math.random() * 0.4 * intensity);
                });

                // Add shake effect for combos
                this.shakeIntensity = Math.min(10, this.comboCount * 2);

                // Create burst particles for combos
                const rgb = this.blob.colors[this.blob.colors.length - 1] || { r: 200, g: 200, b: 220 };
                const particleCount = 10 * this.comboCount;
                const cx = this.canvas.width / 2;
                const cy = this.canvas.height * 0.4;

                for (let i = 0; i < particleCount; i++) {
                    const angle = (i / particleCount) * Math.PI * 2;
                    const speed = 3 + this.comboCount * 2;
                    this.particles.push({
                        x: cx,
                        y: cy,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        size: 2 + this.comboCount,
                        color: rgb
                    });
                }

                this.logEvent({
                    type: 'tap',
                    data: {
                        position: [pos.x, pos.y],
                        comboCount: this.comboCount,
                        intensity: intensity
                    }
                });

                this.showGestureFeedback(`tap ${this.comboCount > 1 ? 'x' + this.comboCount : ''}`);
                this.updateUI();
            }

            handleKnead(path, duration) {
                if (path.length < 2) return;

                const start = path[0];
                const end = path[path.length - 1];
                const direction = this.normalize(end.x - start.x, end.y - start.y);
                const pathLength = this.getPathLength(path);

                this.logEvent({
                    type: 'knead',
                    data: {
                        direction: [direction.x, direction.y],
                        intensity: Math.min(1, pathLength / 150),
                        duration,
                        pathLength: Math.round(pathLength)
                    }
                });

                this.showGestureFeedback('knead');
                this.updateUI();
            }

            handlePress(pos, duration) {
                this.blob.points.forEach(point => {
                    point.targetRadius = this.blob.baseRadius * 0.85;
                });

                this.logEvent({
                    type: 'press',
                    data: {
                        position: [pos.x, pos.y],
                        duration,
                        pressure: Math.min(1, duration / 1500)
                    }
                });

                this.showGestureFeedback('press');
                this.updateUI();
            }

            handleFlick(start, end, velocity) {
                const direction = this.normalize(end.x - start.x, end.y - start.y);

                this.blob.points.forEach((point, i) => {
                    point.targetRadius = this.blob.baseRadius * (1.2 + Math.random() * 0.3);
                });

                // Create energy particles
                const rgb = this.blob.colors[this.blob.colors.length - 1] || { r: 200, g: 200, b: 220 };
                for (let i = 0; i < 20; i++) {
                    this.particles.push({
                        x: this.blob.x * this.canvas.width,
                        y: this.blob.y * this.canvas.height,
                        vx: direction.x * (velocity / 100) + (Math.random() - 0.5) * 2,
                        vy: direction.y * (velocity / 100) + (Math.random() - 0.5) * 2,
                        life: 1,
                        size: 3 + Math.random() * 3,
                        color: rgb
                    });
                }

                this.logEvent({
                    type: 'flick',
                    data: {
                        direction: [direction.x, direction.y],
                        velocity: Math.round(velocity),
                        energy: Math.min(1, velocity / 1000)
                    }
                });

                this.showGestureFeedback('flick');
                this.updateUI();
            }

            // UI updates
            updateUI() {
                const hasInteractions = this.events.length > 0;
                document.getElementById('generateButton').disabled = !hasInteractions;

                // Update history dots
                const dots = document.querySelectorAll('.history-dot');
                const recentEvents = Math.min(this.events.length, dots.length);
                dots.forEach((dot, i) => {
                    if (i < recentEvents) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
            }

            showGestureFeedback(gesture) {
                const feedback = document.getElementById('gestureFeedback');
                feedback.textContent = gesture;
                feedback.classList.add('show');
                setTimeout(() => feedback.classList.remove('show'), 1000);
            }

            undo() {
                if (this.events.length === 0) return;
                this.events.pop();
                this.updateUI();
            }

            // Generate geometry
            async generate() {
                const modal = document.getElementById('generationModal');
                this.outputCanvas = document.getElementById('output-canvas');
                this.outputCtx = this.outputCanvas.getContext('2d');

                // Set canvas to window size
                this.outputCanvas.width = window.innerWidth;
                this.outputCanvas.height = window.innerHeight;

                modal.classList.add('show');
                document.getElementById('generateButton').classList.add('generating');

                // Extract features
                this.generatedFeatures = this.extractFeatures();

                // Wait a bit for effect
                await new Promise(resolve => setTimeout(resolve, 800));

                // Start animation
                this.isGenerating = true;
                this.generationTime = 0;

                document.getElementById('generateButton').classList.remove('generating');
            }

            extractFeatures() {
                const gestureCounts = {};
                let totalIntensity = 0;
                let directionX = 0, directionY = 0;
                let directionalCount = 0;

                this.events.forEach(event => {
                    if (event.type !== 'word_select') {
                        gestureCounts[event.type] = (gestureCounts[event.type] || 0) + 1;

                        if (event.data.intensity) {
                            totalIntensity += event.data.intensity;
                        }

                        if (event.data.direction) {
                            directionX += event.data.direction[0];
                            directionY += event.data.direction[1];
                            directionalCount++;
                        }
                    }
                });

                const gestureEvents = this.events.filter(e => e.type !== 'word_select');
                const avgIntensity = gestureEvents.length > 0 ? totalIntensity / gestureEvents.length : 0.5;
                const dominantDirection = directionalCount > 0
                    ? this.normalize(directionX, directionY)
                    : { x: 1, y: 0 };

                // Determine motif based on gesture distribution
                let motifType = 'hybrid';
                const maxGesture = Object.keys(gestureCounts).reduce((a, b) =>
                    gestureCounts[a] > gestureCounts[b] ? a : b, 'hybrid'
                );

                if (gestureCounts.caress >= 2) motifType = 'radial';
                else if (gestureCounts.poke >= 2) motifType = 'concentric';
                else if (gestureCounts.press >= 2) motifType = 'cluster';
                else if (gestureCounts.flick >= 2) motifType = 'streak';
                else if (gestureCounts.knead >= 2) motifType = 'organic';

                // Calculate blob deformation metrics
                let totalDeformation = 0;
                let maxDeformation = 0;
                this.blob.points.forEach(point => {
                    const deform = Math.sqrt(point.offsetX * point.offsetX + point.offsetY * point.offsetY);
                    totalDeformation += deform;
                    maxDeformation = Math.max(maxDeformation, deform);
                });
                const avgDeformation = totalDeformation / this.blob.points.length;

                // Store blob shape for generation
                const blobShape = this.blob.points.map(point => ({
                    angle: point.angle,
                    radius: point.radius,
                    offsetX: point.offsetX,
                    offsetY: point.offsetY
                }));

                return {
                    selectedWords: Array.from(this.selectedWords),
                    avgIntensity,
                    dominantDirection,
                    densityMetric: this.blob.density,
                    motifType,
                    gestureCounts,
                    blobShape,
                    avgDeformation,
                    maxDeformation
                };
            }

            generateGeometry(ctx, features, animTime = 0) {
                const w = ctx.canvas.width;
                const h = ctx.canvas.height;

                // Calculate scale factor based on canvas size
                // Reference size: 800x1200 (original design size)
                const scale = Math.min(w / 800, h / 1200);

                // Clear canvas with animated background (slower: 0.5->0.167)
                const bgShift = Math.sin(animTime * 0.167) * 5;
                ctx.fillStyle = `rgb(${245 + bgShift}, ${243 + bgShift}, ${240 + bgShift})`;
                ctx.fillRect(0, 0, w, h);

                // Build palette from selected words
                const palette = this.buildPalette(features.selectedWords);

                // Generate based on motif type
                const centerX = w / 2;
                const centerY = h / 2;
                const angle = Math.atan2(features.dominantDirection.y, features.dominantDirection.x) + animTime * 0.033;

                // Use blob deformation to influence global rotation and distortion
                const deformInfluence = Math.min(features.maxDeformation || 0, 1);
                const deformAngle = features.avgDeformation ? Math.atan2(
                    features.blobShape.reduce((sum, p) => sum + p.offsetY, 0),
                    features.blobShape.reduce((sum, p) => sum + p.offsetX, 0)
                ) : 0;

                ctx.save();
                // Global rotation influenced by blob deformation
                ctx.translate(centerX, centerY);
                ctx.rotate(Math.sin(animTime * 0.1) * 0.05 + deformAngle * 0.3);
                // Apply distortion based on deformation
                ctx.scale(1 + deformInfluence * 0.15, 1 - deformInfluence * 0.1);
                ctx.translate(-centerX, -centerY);

                switch (features.motifType) {
                    case 'radial':
                        this.drawRadialMotif(ctx, centerX, centerY, palette, features, angle, animTime, scale);
                        break;
                    case 'concentric':
                        this.drawConcentricMotif(ctx, centerX, centerY, palette, features, animTime, scale);
                        break;
                    case 'cluster':
                        this.drawClusterMotif(ctx, w, h, palette, features, animTime, scale);
                        break;
                    case 'streak':
                        this.drawStreakMotif(ctx, w, h, palette, features, angle, animTime, scale);
                        break;
                    case 'organic':
                        this.drawOrganicMotif(ctx, centerX, centerY, palette, features, animTime, scale);
                        break;
                    default:
                        this.drawHybridMotif(ctx, w, h, palette, features, animTime, scale);
                }

                ctx.restore();

                // Add word-specific effects
                this.applyWordEffects(ctx, w, h, features, animTime, scale);

                // Add subtle texture
                this.addTexture(ctx, w, h);
            }

            buildPalette(words) {
                const colorMap = {
                    warm: ['#D4A574', '#C17B5C', '#B8956A'],
                    cool: ['#6B7C8E', '#A8B5C0', '#5A8AAF'],
                    soft: ['#C2D4DD', '#E3C4C4', '#EBE4D8'],
                    sharp: ['#4A4A4A', '#00A8B8', '#A83232'],
                    heavy: ['#4A4A4A', '#5C5C5C', '#6E6E6E'],
                    light: ['#EBE4D8', '#F5F3F0', '#FFFFFF'],
                    rough: ['#C17B5C', '#A8664D', '#8F523E'],
                    smooth: ['#E3C4C4', '#D4B4B4', '#C5A4A4']
                };

                const colors = [];
                words.forEach(word => {
                    if (colorMap[word]) {
                        colors.push(...colorMap[word]);
                    }
                });

                return colors.length > 0 ? colors : ['#888888', '#999999', '#AAAAAA'];
            }

            drawRadialMotif(ctx, cx, cy, palette, features, angle, animTime = 0, scale = 1) {
                // Blob deformation increases arc density and distortion
                const deformBoost = (features.maxDeformation || 0) * 8;
                const numArcs = Math.floor(8 + features.densityMetric * 12 + deformBoost);

                for (let i = 0; i < numArcs; i++) {
                    // Pulsing radius animation
                    const pulse = Math.sin(animTime * 0.667 + i * 0.5) * 10 * scale;
                    const radius = (200 + i * (400 / numArcs)) * scale + pulse;

                    // Deformation affects arc angle and width
                    const deformAngleShift = (features.avgDeformation || 0) * 0.5;
                    const startAngle = angle - (features.avgIntensity * 0.5) + this.seededRandom() * 0.3 + deformAngleShift;
                    const endAngle = startAngle + (0.4 + features.avgIntensity * 0.6) * (1 + (features.maxDeformation || 0) * 0.3);
                    const strokeWidth = (8 + (1 - i / numArcs) * 20) * scale * (1 + (features.avgDeformation || 0) * 0.4);

                    // Floating animation
                    const floatX = Math.sin(animTime * 0.3 + i * 0.4) * 8 * scale;
                    const floatY = Math.cos(animTime * 0.25 + i * 0.3) * 8 * scale;

                    ctx.beginPath();
                    ctx.arc(cx + floatX, cy + floatY, radius, startAngle, endAngle);
                    ctx.strokeStyle = palette[i % palette.length];
                    ctx.lineWidth = strokeWidth;
                    ctx.globalAlpha = 0.6 - (i / numArcs) * 0.3;
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            drawConcentricMotif(ctx, cx, cy, palette, features, animTime = 0, scale = 1) {
                // Blob deformation increases ring density and spacing irregularity
                const deformBoost = (features.maxDeformation || 0) * 6;
                const numRings = Math.floor(6 + features.densityMetric * 10 + deformBoost);

                for (let i = 0; i < numRings; i++) {
                    // Expanding/contracting animation
                    const wave = Math.sin(animTime * 0.5 - i * 0.4) * 15 * scale;
                    const irregularity = (features.avgDeformation || 0) * 50 * scale;
                    const radius = (60 + i * (500 / numRings)) * scale + wave + (this.seededRandom() - 0.5) * irregularity;
                    const strokeWidth = (3 + features.avgIntensity * 8) * scale * (1 + (features.maxDeformation || 0) * 0.3);

                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = palette[i % palette.length];
                    ctx.lineWidth = strokeWidth + Math.sin(animTime * 0.333 + i) * 2 * scale;
                    ctx.globalAlpha = 0.7 - (i / numRings) * 0.4;
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            drawClusterMotif(ctx, w, h, palette, features, animTime = 0, scale = 1) {
                const numClusters = Math.floor(3 + features.densityMetric * 5);
                const margin = 100 * scale;

                for (let c = 0; c < numClusters; c++) {
                    const clusterX = margin + this.seededRandom() * (w - margin * 2);
                    const clusterY = margin + this.seededRandom() * (h - margin * 2);

                    // Blob deformation increases scatter within clusters
                    const scatterBoost = (features.maxDeformation || 0) * 15;
                    const numCircles = Math.floor(15 + features.avgIntensity * 30 + scatterBoost);

                    for (let i = 0; i < numCircles; i++) {
                        // Deformation increases spread
                        const spreadMultiplier = 1 + (features.avgDeformation || 0) * 1.5;
                        const offsetX = (this.seededRandom() - 0.5) * 120 * scale * spreadMultiplier;
                        const offsetY = (this.seededRandom() - 0.5) * 120 * scale * spreadMultiplier;
                        const radius = (10 + this.seededRandom() * 40) * scale * (1 + (features.maxDeformation || 0) * 0.3);

                        // Pulsing radius and floating animation
                        const pulse = Math.sin(animTime * 0.667 + c * 0.5 + i * 0.2) * 0.2;
                        const animRadius = radius * (1 + pulse);
                        const floatX = Math.sin(animTime * 0.4 + c * 0.3 + i * 0.15) * 5 * scale;
                        const floatY = Math.cos(animTime * 0.35 + c * 0.25 + i * 0.12) * 5 * scale;

                        ctx.beginPath();
                        ctx.arc(clusterX + offsetX + floatX, clusterY + offsetY + floatY, animRadius, 0, Math.PI * 2);
                        ctx.fillStyle = palette[i % palette.length];
                        ctx.globalAlpha = 0.4 + this.seededRandom() * 0.3;
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1;
            }

            drawStreakMotif(ctx, w, h, palette, features, angle, animTime = 0, scale = 1) {
                // Blob deformation increases block density and angular variation
                const deformBoost = (features.maxDeformation || 0) * 12;
                const numBlocks = Math.floor(12 + features.densityMetric * 20 + deformBoost);

                for (let i = 0; i < numBlocks; i++) {
                    const startX = this.seededRandom() * w;
                    const startY = this.seededRandom() * h;
                    const length = (80 + features.avgIntensity * 200) * scale * (1 + (features.avgDeformation || 0) * 0.4);
                    const width = (20 + this.seededRandom() * 60) * scale * (1 + (features.maxDeformation || 0) * 0.3);

                    // Deformation affects angle variation
                    const angleVariation = 0.4 * (1 + (features.maxDeformation || 0));
                    const localAngle = angle + (this.seededRandom() - 0.5) * angleVariation;

                    // Flowing animation - shift length and position
                    const lengthShift = Math.sin(animTime * 0.5 + i * 0.3) * 30 * scale;
                    const animLength = length + lengthShift;
                    const posShift = Math.sin(animTime * 0.4 + i * 0.4) * 15 * scale;

                    // Floating animation
                    const floatY = Math.cos(animTime * 0.35 + i * 0.25) * 10 * scale;

                    ctx.save();
                    ctx.translate(startX, startY + floatY);
                    ctx.rotate(localAngle);
                    ctx.translate(posShift, 0);

                    // 50% chance of blurred edges, 50% sharp edges
                    const isBlurred = this.seededRandom() > 0.5;

                    if (isBlurred) {
                        // Blurred edges
                        ctx.shadowBlur = 15 * scale + Math.sin(animTime * 0.5 + i * 0.2) * 5 * scale;
                        ctx.shadowColor = palette[i % palette.length];
                    }

                    ctx.fillStyle = palette[i % palette.length];
                    ctx.globalAlpha = 0.4 + this.seededRandom() * 0.3;
                    ctx.fillRect(0, -width / 2, animLength, width);

                    ctx.restore();
                }

                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }

            drawHybridMotif(ctx, w, h, palette, features, animTime = 0, scale = 1) {
                // Combine multiple styles
                const cx = w / 2;
                const cy = h / 2;

                // Blob deformation increases circle count and irregularity
                const circleBoost = Math.floor((features.maxDeformation || 0) * 3);
                const numCircles = 5 + circleBoost;

                // Some circles with pulsing and floating
                for (let i = 0; i < numCircles; i++) {
                    const radius = (100 + i * 80) * scale * (1 + (features.avgDeformation || 0) * 0.3);
                    const pulse = Math.sin(animTime * 0.667 + i * 0.6) * 15 * scale;
                    const animRadius = radius + pulse;
                    const floatX = Math.sin(animTime * 0.3 + i * 0.4) * 12 * scale;
                    const floatY = Math.cos(animTime * 0.25 + i * 0.35) * 12 * scale;

                    ctx.beginPath();
                    ctx.arc(cx + floatX, cy + floatY, animRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = palette[i % palette.length];
                    ctx.lineWidth = 4 * scale * (1 + (features.maxDeformation || 0) * 0.4);
                    ctx.globalAlpha = 0.5;
                    ctx.stroke();
                }

                // Blob deformation increases shape count and size variation
                const shapeBoost = Math.floor((features.maxDeformation || 0) * 5);
                const numShapes = 10 + shapeBoost;
                const margin = 100 * scale;

                for (let i = 0; i < numShapes; i++) {
                    const x = margin + this.seededRandom() * (w - margin * 2);
                    const y = margin + this.seededRandom() * (h - margin * 2);
                    const size = (30 + this.seededRandom() * 60) * scale * (1 + (features.avgDeformation || 0) * 0.5);

                    // Floating animation
                    const floatX = Math.sin(animTime * 0.4 + i * 0.5) * 20 * scale;
                    const floatY = Math.cos(animTime * 0.267 + i * 0.3) * 15 * scale;
                    const animX = x + floatX;
                    const animY = y + floatY;

                    ctx.fillStyle = palette[i % palette.length];
                    ctx.globalAlpha = 0.4;

                    if (i % 2 === 0) {
                        ctx.fillRect(animX, animY, size, size);
                    } else {
                        ctx.beginPath();
                        ctx.arc(animX, animY, size / 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.globalAlpha = 1;
            }

            drawOrganicMotif(ctx, cx, cy, palette, features, animTime = 0, scale = 1) {
                // Draw shape based on blob deformation
                if (!features.blobShape || features.blobShape.length === 0) return;

                const shapeScale = 300 * scale; // Scale factor for the shape

                // Floating animation for entire shape
                const floatX = Math.sin(animTime * 0.3) * 15 * scale;
                const floatY = Math.cos(animTime * 0.25) * 15 * scale;

                ctx.save();
                ctx.translate(cx + floatX, cy + floatY);

                // Add rotation animation (slower: 0.5->0.167)
                const rotation = Math.sin(animTime * 0.167) * 0.1;
                ctx.rotate(rotation);

                // Draw multiple layers of the organic shape
                for (let layer = 0; layer < 3; layer++) {
                    ctx.beginPath();

                    // Pulsing scale animation (slower: 1.5->0.5)
                    const scalePulse = Math.sin(animTime * 0.5 + layer * 0.5) * 0.1;
                    const layerScale = shapeScale * (1 + layer * 0.3) * (1 + scalePulse);

                    features.blobShape.forEach((point, i) => {
                        const r = layerScale * point.radius;
                        const x = Math.cos(point.angle) * r + point.offsetX * layerScale;
                        const y = Math.sin(point.angle) * r + point.offsetY * layerScale;

                        if (i === 0) {
                            ctx.moveTo(x, y);
                        } else {
                            ctx.lineTo(x, y);
                        }
                    });
                    ctx.closePath();

                    ctx.strokeStyle = palette[layer % palette.length];
                    ctx.lineWidth = (8 - layer * 2) * scale;
                    ctx.globalAlpha = 0.6 - layer * 0.15;
                    ctx.stroke();
                }

                ctx.restore();
                ctx.globalAlpha = 1;
            }

            applyWordEffects(ctx, w, h, features, animTime = 0, scale = 1) {
                const cx = w / 2;
                const cy = h / 2;

                // Sharp: Add spikes with rotation
                if (features.selectedWords.includes('sharp')) {
                    const numSpikes = 20 + Math.floor(features.avgIntensity * 15);
                    ctx.save();
                    ctx.translate(cx, cy);

                    // Rotate spikes (slower: 0.3->0.1)
                    const rotation = animTime * 0.1;
                    ctx.rotate(rotation);
                    ctx.translate(-cx, -cy);

                    for (let i = 0; i < numSpikes; i++) {
                        const angle = (i / numSpikes) * Math.PI * 2;
                        const baseRadius = (150 + this.seededRandom() * 200) * scale;
                        const spikeLength = (40 + this.seededRandom() * 80) * scale;

                        // Pulsing spike length
                        const lengthPulse = Math.sin(animTime * 0.833 + i * 0.3) * 15 * scale;
                        const animSpikeLength = spikeLength + lengthPulse;

                        const x1 = cx + Math.cos(angle) * baseRadius;
                        const y1 = cy + Math.sin(angle) * baseRadius;
                        const x2 = cx + Math.cos(angle) * (baseRadius + animSpikeLength);
                        const y2 = cy + Math.sin(angle) * (baseRadius + animSpikeLength);

                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.strokeStyle = '#00A8B8';
                        ctx.lineWidth = (2 + this.seededRandom() * 4) * scale;
                        ctx.globalAlpha = 0.5 + this.seededRandom() * 0.3;
                        ctx.stroke();
                    }

                    ctx.restore();
                }

                // Rough: Add jagged, uneven lines with wiggle
                if (features.selectedWords.includes('rough')) {
                    const numLines = 15;
                    ctx.save();

                    for (let i = 0; i < numLines; i++) {
                        ctx.beginPath();
                        const startX = this.seededRandom() * w;
                        const startY = this.seededRandom() * h;
                        const endX = startX + (this.seededRandom() - 0.5) * 300 * scale;
                        const endY = startY + (this.seededRandom() - 0.5) * 300 * scale;

                        // Create jagged path with wiggle animation
                        ctx.moveTo(startX, startY);
                        const segments = 8 + Math.floor(this.seededRandom() * 8);
                        for (let s = 1; s <= segments; s++) {
                            const t = s / segments;
                            const wiggle = Math.sin(animTime * 0.667 + i * 0.5 + s * 0.4) * 8 * scale;
                            const x = startX + (endX - startX) * t + (this.seededRandom() - 0.5) * 40 * scale + wiggle;
                            const y = startY + (endY - startY) * t + (this.seededRandom() - 0.5) * 40 * scale + wiggle;
                            ctx.lineTo(x, y);
                        }

                        ctx.strokeStyle = '#C17B5C';
                        ctx.lineWidth = (3 + this.seededRandom() * 5) * scale;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.globalAlpha = 0.4 + this.seededRandom() * 0.2;
                        ctx.stroke();
                    }

                    ctx.restore();
                }

                // Heavy: Add dense dark shapes with sinking motion
                if (features.selectedWords.includes('heavy')) {
                    ctx.save();
                    const numShapes = 30;

                    for (let i = 0; i < numShapes; i++) {
                        const x = cx + (this.seededRandom() - 0.5) * 400 * scale;
                        const y = cy + (this.seededRandom() - 0.5) * 600 * scale;
                        const size = (10 + this.seededRandom() * 40) * scale;

                        // Sinking/floating motion
                        const sinkY = Math.sin(animTime * 0.267 + i * 0.4) * 10 * scale;
                        const animY = y + sinkY;

                        ctx.fillStyle = '#4A4A4A';
                        ctx.globalAlpha = 0.3 + this.seededRandom() * 0.3;
                        ctx.fillRect(x - size/2, animY - size/2, size, size);
                    }

                    ctx.restore();
                }

                // Light: Add airy, scattered dots with twinkling
                if (features.selectedWords.includes('light')) {
                    ctx.save();
                    const numDots = 100;

                    for (let i = 0; i < numDots; i++) {
                        const x = this.seededRandom() * w;
                        const y = this.seededRandom() * h;
                        const size = (1 + this.seededRandom() * 4) * scale;

                        // Size pulsing and floating motion
                        const sizePulse = Math.sin(animTime * 1 + i * 0.15) * 0.3;
                        const animSize = size * (1 + sizePulse);

                        // Gentle floating motion - both X and Y for more dynamic feel
                        const floatX = Math.sin(animTime * 0.4 + i * 0.12) * 4 * scale;
                        const floatY = Math.cos(animTime * 0.5 + i * 0.1) * 5 * scale;

                        ctx.beginPath();
                        ctx.arc(x + floatX, y + floatY, animSize, 0, Math.PI * 2);
                        ctx.fillStyle = '#EBE4D8';
                        ctx.globalAlpha = 0.2 + this.seededRandom() * 0.4;
                        ctx.fill();
                    }

                    ctx.restore();
                }

                // Warm: Add warm gradients with pulsing
                if (features.selectedWords.includes('warm')) {
                    ctx.save();

                    // Pulsing gradient radius (slower: 1.5->0.5)
                    const radiusPulse = Math.sin(animTime * 0.5) * 100 * scale;
                    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, 500 * scale + radiusPulse);

                    // Pulsing opacity (slower: 1.2->0.4)
                    const opacityPulse = Math.sin(animTime * 0.4) * 0.05;
                    gradient.addColorStop(0, `rgba(212, 165, 116, ${0.15 + opacityPulse})`);
                    gradient.addColorStop(0.5, `rgba(193, 123, 92, ${0.08 + opacityPulse * 0.5})`);
                    gradient.addColorStop(1, 'rgba(184, 149, 106, 0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    ctx.restore();
                }

                // Cool: Add cool tones overlay with pulsing
                if (features.selectedWords.includes('cool')) {
                    ctx.save();

                    // Pulsing gradient radius (slower: 1.3->0.433)
                    const radiusPulse = Math.sin(animTime * 0.433) * 100 * scale;
                    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, 500 * scale + radiusPulse);

                    // Pulsing opacity (slower: 1.4->0.467)
                    const opacityPulse = Math.sin(animTime * 0.467) * 0.04;
                    gradient.addColorStop(0, `rgba(107, 124, 142, ${0.12 + opacityPulse})`);
                    gradient.addColorStop(0.5, `rgba(168, 181, 192, ${0.06 + opacityPulse * 0.5})`);
                    gradient.addColorStop(1, 'rgba(90, 138, 175, 0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, w, h);
                    ctx.restore();
                }

                ctx.globalAlpha = 1;
            }

            addTexture(ctx, w, h) {
                const imageData = ctx.getImageData(0, 0, w, h);
                const data = imageData.data;

                for (let i = 0; i < data.length; i += 4) {
                    const noise = (Math.random() - 0.5) * 5;
                    data[i] += noise;
                    data[i + 1] += noise;
                    data[i + 2] += noise;
                }

                ctx.putImageData(imageData, 0, 0);
            }

            closeModal() {
                document.getElementById('generationModal').classList.remove('show');
                this.isGenerating = false;
                this.generationTime = 0;
            }

            download() {
                const canvas = document.getElementById('output-canvas');
                const link = document.createElement('a');
                link.download = `emotional-composition-${this.sessionId}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }

            // Animation loop
            animate() {
                this.time += 0.016;

                // Clear canvas
                this.ctx.fillStyle = `rgb(${this.backgroundColor.r}, ${this.backgroundColor.g}, ${this.backgroundColor.b})`;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Update blob points
                this.blob.points.forEach((point, i) => {
                    const noise = Math.sin(this.time + point.noiseOffset) * 0.02;
                    point.radius += (point.targetRadius - point.radius) * 0.1;
                    point.angle += 0.001;

                    // Update playdough offsets with smooth interpolation
                    point.offsetX += (point.targetOffsetX - point.offsetX) * 0.15;
                    point.offsetY += (point.targetOffsetY - point.offsetY) * 0.15;

                    // Keep the deformed shape (no auto-recovery)
                });

                // Draw blob
                this.drawBlob();

                // Update and draw particles
                this.updateParticles();

                // Draw combo indicator
                if (this.showCombo && this.comboCount > 1) {
                    this.comboFade -= 0.02;
                    if (this.comboFade <= 0) {
                        this.showCombo = false;
                    } else {
                        const cx = this.canvas.width / 2;
                        const cy = this.canvas.height * 0.4;

                        this.ctx.save();
                        this.ctx.font = `bold ${40 + this.comboCount * 5}px Arial`;
                        this.ctx.textAlign = 'center';
                        this.ctx.textBaseline = 'middle';

                        // Combo text with glow
                        this.ctx.shadowColor = 'rgba(255, 200, 0, 0.8)';
                        this.ctx.shadowBlur = 20;
                        this.ctx.fillStyle = `rgba(255, 220, 50, ${this.comboFade})`;
                        this.ctx.fillText(`×${this.comboCount}`, cx, cy - 80);

                        // Combo label
                        this.ctx.font = '20px Arial';
                        this.ctx.shadowBlur = 10;
                        this.ctx.fillStyle = `rgba(255, 255, 255, ${this.comboFade * 0.8})`;
                        this.ctx.fillText('COMBO', cx, cy - 120);

                        this.ctx.restore();
                    }
                }

                // Render generated artwork if active
                if (this.isGenerating && this.outputCtx && this.generatedFeatures) {
                    this.generationTime += 0.016;
                    this.generateGeometry(this.outputCtx, this.generatedFeatures, this.generationTime);
                }

                requestAnimationFrame(() => this.animate());
            }

            drawBlob() {
                // Always draw blob at screen center (40% from top)
                let cx = this.canvas.width / 2;
                let cy = this.canvas.height * 0.4;

                // Apply shake effect
                if (this.shakeIntensity > 0) {
                    cx += (Math.random() - 0.5) * this.shakeIntensity;
                    cy += (Math.random() - 0.5) * this.shakeIntensity;
                    this.shakeIntensity *= 0.9; // Decay shake
                }

                const baseSize = Math.min(this.canvas.width, this.canvas.height) * this.blob.baseRadius;

                this.ctx.save();
                this.ctx.translate(cx, cy);

                // Draw soft glow
                const gradient = this.ctx.createRadialGradient(0, 0, 0, 0, 0, baseSize * 2);
                const mainColor = this.blob.colors[this.blob.colors.length - 1];
                gradient.addColorStop(0, `rgba(${mainColor.r}, ${mainColor.g}, ${mainColor.b}, 0.1)`);
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(-baseSize * 2, -baseSize * 2, baseSize * 4, baseSize * 4);

                // Draw blob shape with playdough deformation
                this.ctx.beginPath();
                this.blob.points.forEach((point, i) => {
                    const radius = baseSize * point.radius * this.blob.density;
                    // Base position from angle and radius
                    const baseX = Math.cos(point.angle) * radius;
                    const baseY = Math.sin(point.angle) * radius;
                    // Add offset for playdough effect
                    const x = baseX + point.offsetX;
                    const y = baseY + point.offsetY;

                    if (i === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        const prevPoint = this.blob.points[i - 1];
                        const prevRadius = baseSize * prevPoint.radius * this.blob.density;
                        const prevBaseX = Math.cos(prevPoint.angle) * prevRadius;
                        const prevBaseY = Math.sin(prevPoint.angle) * prevRadius;
                        const prevX = prevBaseX + prevPoint.offsetX;
                        const prevY = prevBaseY + prevPoint.offsetY;

                        const cpX = (prevX + x) / 2;
                        const cpY = (prevY + y) / 2;
                        this.ctx.quadraticCurveTo(prevX, prevY, cpX, cpY);
                    }
                });
                this.ctx.closePath();

                // Fill blob
                this.ctx.fillStyle = `rgba(${mainColor.r}, ${mainColor.g}, ${mainColor.b}, 0.3)`;
                this.ctx.fill();

                // Stroke blob
                this.ctx.strokeStyle = `rgba(${mainColor.r}, ${mainColor.g}, ${mainColor.b}, 0.6)`;
                this.ctx.lineWidth = 3;
                this.ctx.stroke();

                this.ctx.restore();
            }

            updateParticles() {
                this.particles = this.particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1; // Gravity
                    p.life -= 0.01;

                    if (p.life > 0) {
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                        this.ctx.fillStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${p.life * 0.7})`;
                        this.ctx.fill();
                        return true;
                    }
                    return false;
                });
            }

            createParticles(x, y, color) {
                for (let i = 0; i < 12; i++) {
                    const angle = (i / 12) * Math.PI * 2;
                    const speed = 2 + Math.random() * 3;
                    this.particles.push({
                        x,
                        y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        size: 2 + Math.random() * 2,
                        color
                    });
                }
            }

            // Kneading functions
            isTouchingBlob(pos) {
                // Check if touch is within blob radius
                const cx = 0.5;
                const cy = 0.4;
                const dx = pos.x - cx;
                const dy = pos.y - cy;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < this.blob.baseRadius * 1.2;
            }

            getClosestBlobPoint(pos) {
                // Find the blob vertex closest to touch position
                const cx = 0.5;
                const cy = 0.4;
                const angle = Math.atan2(pos.y - cy, pos.x - cx);

                let closestIndex = 0;
                let minDiff = Math.PI * 2;

                this.blob.points.forEach((point, i) => {
                    let diff = Math.abs(angle - point.angle);
                    if (diff > Math.PI) diff = Math.PI * 2 - diff;
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestIndex = i;
                    }
                });

                return closestIndex;
            }

            applyKneading(pos) {
                // Convert normalized position to canvas pixels
                const touchX = pos.x * this.canvas.width;
                const touchY = pos.y * this.canvas.height;

                // Blob center in pixels
                const blobCenterX = this.canvas.width / 2;
                const blobCenterY = this.canvas.height * 0.4;

                // Calculate pull vector (from blob center to touch)
                const pullX = touchX - blobCenterX;
                const pullY = touchY - blobCenterY;
                const pullDistance = Math.sqrt(pullX * pullX + pullY * pullY);

                if (pullDistance < 10) return; // Too close to center

                // Normalize pull direction
                const pullDirX = pullX / pullDistance;
                const pullDirY = pullY / pullDistance;

                // Pull angle
                const pullAngle = Math.atan2(pullY, pullX);

                const baseSize = Math.min(this.canvas.width, this.canvas.height) * this.blob.baseRadius;

                // Apply deformation to all points based on proximity
                this.blob.points.forEach((point, i) => {
                    // Calculate angular difference
                    let angleDiff = Math.abs(point.angle - pullAngle);
                    if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;

                    // Influence based on angular proximity (wider range for more dramatic effect)
                    const maxInfluenceAngle = Math.PI / 2; // 90 degrees on each side
                    if (angleDiff < maxInfluenceAngle) {
                        const influence = Math.cos(angleDiff / maxInfluenceAngle * Math.PI / 2); // Smooth falloff

                        // Calculate pull strength (stronger when pulling further out)
                        const pullStrength = Math.min(1.0, pullDistance / (baseSize * 1.5));

                        // Apply offset in the pull direction
                        const offsetMagnitude = baseSize * pullStrength * influence * 0.6;
                        point.targetOffsetX = pullDirX * offsetMagnitude;
                        point.targetOffsetY = pullDirY * offsetMagnitude;

                        // Also slightly increase radius for pulled points
                        point.targetRadius = this.blob.baseRadius * (1 + influence * 0.2);
                    } else {
                        // Points on opposite side compress slightly
                        const oppositeInfluence = Math.max(0, -Math.cos(angleDiff));
                        point.targetRadius = this.blob.baseRadius * (1 - oppositeInfluence * 0.15);
                    }
                });
            }

            // Utility functions
            logEvent(event) {
                event.id = this.events.length;
                event.timestamp = Date.now();
                this.events.push(event);
            }

            getTouchPos(touch) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: (touch.clientX - rect.left) / rect.width,
                    y: (touch.clientY - rect.top) / rect.height
                };
            }

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) / rect.width,
                    y: (e.clientY - rect.top) / rect.height
                };
            }

            getTouchDistance(t1, t2) {
                const dx = t1.clientX - t2.clientX;
                const dy = t1.clientY - t2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            getDistance(p1, p2) {
                const dx = (p2.x - p1.x) * this.canvas.width;
                const dy = (p2.y - p1.y) * this.canvas.height;
                return Math.sqrt(dx * dx + dy * dy);
            }

            getPathLength(path) {
                let length = 0;
                for (let i = 1; i < path.length; i++) {
                    length += this.getDistance(path[i - 1], path[i]);
                }
                return length;
            }

            normalize(x, y) {
                const mag = Math.sqrt(x * x + y * y);
                return mag > 0 ? { x: x / mag, y: y / mag } : { x: 1, y: 0 };
            }

            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 0, g: 0, b: 0 };
            }

            seededRandom() {
                // Simple deterministic random (for reproducibility)
                this._seed = (this._seed || this.sessionId) * 16807 % 2147483647;
                return (this._seed - 1) / 2147483646;
            }
        }

        // Initialize when ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => new EmotionalExplorer());
        } else {
            new EmotionalExplorer();
        }
    </script>
</body>
