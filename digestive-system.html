<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Digestive System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .instructions {
            color: white;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            max-width: 600px;
            text-align: center;
        }

        #canvas {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <h1>Interactive Digestive System</h1>
    <div class="instructions">
        <p><strong>Instructions:</strong></p>
        <p>Click on the mouth to add food. Click the "Digest" button to watch the digestion process. Drag and drop food items to move them around!</p>
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div class="controls">
        <button id="digestBtn">Start Digestion</button>
        <button id="resetBtn">Reset</button>
        <button id="addFoodBtn">Add Food</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Intestine path coordinates - stylized small intestine shape
        const intestinePath = [

            {x: 688, y: 393},
            {x: 702, y: 385},
            {x: 710, y: 373},
            {x: 712, y: 358}
        ];

        // Food particles
        let foodParticles = [];
        let isDragging = false;
        let draggedFood = null;
        let isDigesting = false;

        // Digestive system components
        const mouth = { x: 400, y: 50, radius: 30 };
        const esophagus = { x1: 400, y1: 80, x2: 400, y2: 180 };
        const stomach = { x: 400, y: 215, width: 80, height: 60 };

        class FoodParticle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 8;
                this.color = this.randomFoodColor();
                this.pathIndex = 0;
                this.inMouth = true;
                this.inEsophagus = false;
                this.inStomach = false;
                this.inIntestine = false;
                this.speed = 2;
                this.isDraggable = true;
            }

            randomFoodColor() {
                const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            moveToStomach() {
                if (this.inMouth) {
                    if (this.y < esophagus.y1) {
                        this.y += this.speed;
                    } else {
                        this.inMouth = false;
                        this.inEsophagus = true;
                    }
                } else if (this.inEsophagus) {
                    if (this.y < stomach.y) {
                        this.y += this.speed;
                    } else {
                        this.inEsophagus = false;
                        this.inStomach = true;
                    }
                }
            }

            moveAlongIntestine() {
                if (this.pathIndex < intestinePath.length - 1) {
                    const target = intestinePath[this.pathIndex + 1];
                    const dx = target.x - this.x;
                    const dy = target.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 5) {
                        this.pathIndex++;
                    } else {
                        this.x += (dx / distance) * this.speed;
                        this.y += (dy / distance) * this.speed;
                    }
                }
            }

            contains(px, py) {
                const dx = px - this.x;
                const dy = py - this.y;
                return Math.sqrt(dx * dx + dy * dy) < this.radius;
            }
        }

        function drawMouth() {
            ctx.beginPath();
            ctx.arc(mouth.x, mouth.y, mouth.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FFB6C1';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Smile
            ctx.beginPath();
            ctx.arc(mouth.x, mouth.y, mouth.radius * 0.6, 0.2 * Math.PI, 0.8 * Math.PI);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawEsophagus() {
            ctx.beginPath();
            ctx.moveTo(esophagus.x1 - 10, esophagus.y1);
            ctx.lineTo(esophagus.x2 - 10, esophagus.y2);
            ctx.lineTo(esophagus.x2 + 10, esophagus.y2);
            ctx.lineTo(esophagus.x1 + 10, esophagus.y1);
            ctx.closePath();
            ctx.fillStyle = '#FFB6C1';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function drawStomach() {
            ctx.beginPath();
            ctx.ellipse(stomach.x, stomach.y, stomach.width, stomach.height, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#FFB6C1';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function drawIntestine() {
            // Draw the main intestine path
            ctx.beginPath();
            ctx.moveTo(intestinePath[0].x, intestinePath[0].y);

            for (let i = 1; i < intestinePath.length; i++) {
                ctx.lineTo(intestinePath[i].x, intestinePath[i].y);
            }

            ctx.strokeStyle = '#000000';  // Black color
            ctx.lineWidth = 8;  // Thick outline
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            // Draw inner lighter line for depth
            ctx.beginPath();
            ctx.moveTo(intestinePath[0].x, intestinePath[0].y);

            for (let i = 1; i < intestinePath.length; i++) {
                ctx.lineTo(intestinePath[i].x, intestinePath[i].y);
            }

            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        function addFood() {
            foodParticles.push(new FoodParticle(mouth.x, mouth.y));
        }

        function startDigestion() {
            isDigesting = true;
            foodParticles.forEach(food => {
                if (food.inStomach) {
                    food.inStomach = false;
                    food.inIntestine = true;
                    food.x = intestinePath[0].x;
                    food.y = intestinePath[0].y;
                    food.pathIndex = 0;
                }
            });
        }

        function reset() {
            foodParticles = [];
            isDigesting = false;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw digestive system
            drawMouth();
            drawEsophagus();
            drawStomach();
            drawIntestine();

            // Update and draw food particles
            foodParticles.forEach((food, index) => {
                if (isDigesting && food.inIntestine) {
                    food.moveAlongIntestine();
                } else if (!isDragging || draggedFood !== food) {
                    food.moveToStomach();
                }
                food.draw();

                // Remove food that has completed the journey
                if (food.pathIndex >= intestinePath.length - 1 && food.inIntestine) {
                    foodParticles.splice(index, 1);
                }
            });

            requestAnimationFrame(draw);
        }

        // Mouse event handlers for drag and drop
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check if clicking on mouth to add food
            const distToMouth = Math.sqrt(
                Math.pow(mouseX - mouth.x, 2) + Math.pow(mouseY - mouth.y, 2)
            );
            if (distToMouth < mouth.radius) {
                addFood();
                return;
            }

            // Check if clicking on food to drag
            for (let i = foodParticles.length - 1; i >= 0; i--) {
                if (foodParticles[i].contains(mouseX, mouseY)) {
                    isDragging = true;
                    draggedFood = foodParticles[i];
                    break;
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging && draggedFood) {
                const rect = canvas.getBoundingClientRect();
                draggedFood.x = e.clientX - rect.left;
                draggedFood.y = e.clientY - rect.top;
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            draggedFood = null;
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            draggedFood = null;
        });

        // Button event listeners
        document.getElementById('digestBtn').addEventListener('click', startDigestion);
        document.getElementById('resetBtn').addEventListener('click', reset);
        document.getElementById('addFoodBtn').addEventListener('click', addFood);

        // Start animation
        draw();
    </script>
</body>
</html>
